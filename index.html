
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Daily Task Tracker</h1>
        <p>Organize your day, one task at a time.</p>
    </header>

    <main>
        <section class="task-form">
            <h2>Add a New Task</h2>

            <form id="task-form">
                <input
                    type="text"
                    id="task-input"
                    placeholder="What do you need to do?"
                    required
                >

                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="task-list">
            <h2>My Tasks</h2>

            <div class="task-filters">
                <button type="button" data-filter="all">All</button>
                <button type="button" data-filter="pending">Pending</button>
                <button type="button" data-filter="completed">Completed</button>
            </div>

            <ul id="task-list">
                <!-- JavaScript will add tasks here -->
            </ul>

            <p id="empty-message">No tasks yet. Add your first task!</p>
        </section>
    </main>

    <footer>
        <p>Daily Task Tracker | Project 3</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
